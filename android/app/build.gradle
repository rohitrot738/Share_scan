plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.rohitrot738.sharescan'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rohitrot738.sharescan'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
        ndk {
            // Target the user's modern ARM64 Android device. Keeping one ABI also
            // avoids shipping an unnecessary x86_64 native Python runtime.
            abiFilters 'arm64-v8a'
        }
    }
}

chaquopy {
    defaultConfig {
        // Chaquopy 17 explicitly supports Android devices using 16 KB pages.
        // Python 3.13 gives the best compatibility with current Android wheels.
        version = '3.13'
        pip {
            install 'numpy>=2.1,<3'
            install 'pandas>=2.2,<3'
            install 'requests>=2.32,<3'
            install 'yfinance>=0.2.54,<2'
        }
    }
}
