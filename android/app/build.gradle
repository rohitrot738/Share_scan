plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.rohitrot738.sharescan'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rohitrot738.sharescan'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    lint {
        abortOnError false
    }
}

def pythonSourceDir = layout.buildDirectory.dir('generated/python/main')

tasks.register('preparePythonSources', Sync) {
    from(rootProject.projectDir.parent) {
        include('*.py')
        include('cr360/**/*.py')
        include('execution/**/*.py')
        include('ghost_pro/**/*.py')
        include('native/*.py')
        exclude('tests/**')
        exclude('training_cases/**')
        exclude('android/**')
    }
    into(pythonSourceDir)
}

tasks.named('preBuild').configure {
    dependsOn('preparePythonSources')
}

tasks.matching { it.name in ['mergeDebugPythonSources', 'mergeReleasePythonSources'] }.configureEach {
    dependsOn('preparePythonSources')
}

chaquopy {
    defaultConfig {
        version = '3.11'
        buildPython('python3.11')
        pip {
            install('numpy==1.26.2')
            install('pandas==2.1.3')
            install('requests==2.32.5')
            options('--extra-index-url', 'https://chaquo.com/pypi-extra')
            install('lxml==5.2.2')
        }
    }
    sourceSets {
        getByName('main') {
            srcDir(pythonSourceDir)
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
