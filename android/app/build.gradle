plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.rohitrot738.sharescan'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rohitrot738.sharescan'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        pip {
            install 'numpy>=1.26,<3'
            install 'pandas>=2.2,<3'
            install 'requests>=2.32,<3'
            install 'yfinance>=0.2.54,<2'
        }
    }
}
