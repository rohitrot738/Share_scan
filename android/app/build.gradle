plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.rohitrot738.sharescan'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rohitrot738.sharescan'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.0.3'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
}

chaquopy {
    defaultConfig {
        // Chaquopy 17 supports Android devices using 16 KB memory pages.
        // Chaquopy's Android package index currently provides NumPy 1.26.2
        // for this Python target, so keep the dependency pinned to that build.
        version = '3.13'
        pip {
            install 'numpy==1.26.2'
            install 'pandas>=2.2,<3'
            install 'requests>=2.32,<3'
            install 'yfinance>=0.2.54,<2'
        }
    }
}
