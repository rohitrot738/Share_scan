name: Test 360CR
on:
  workflow_dispatch:
  push:
    paths:
      - 'cr360/**'
      - 'tests/test_cr360*'
      - 'tests/test_nse_public_adapter.py'
      - '.github/workflows/test-360cr.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest pandas yfinance requests beautifulsoup4 lxml
      - name: Verify package import
        run: python -c "import cr360; print('cr360 import OK:', cr360.__file__)"
      - run: python -m pytest -q tests/test_cr360.py tests/test_cr360_collector.py tests/test_nse_public_adapter.py
      - name: Search-first multi-source candidate diagnostic
        continue-on-error: true
        run: |
          python - <<'PY'
          from cr360.web_discovery_collector import collect_search_first_360cr
          from cr360.validator import validate_360cr_input
          from cr360 import analyse_360cr
          for sym in ('RELIANCE','HDFCBANK'):
              x=collect_search_first_360cr(sym)
              r=analyse_360cr(x); v=validate_360cr_input(x)
              print('SEARCH_FIRST',sym,'counts=',x.metadata.get('search_first_counts'))
              print('SEARCH_FIRST',sym,'errors=',x.metadata.get('search_first_errors'))
              ev=x.metadata.get('search_first_evidence') or {}
              print('SEARCH_FIRST',sym,'financial_sources=',ev.get('financial_sources'))
              print('SEARCH_FIRST',sym,'shareholding_sources=',ev.get('shareholding_sources'))
              print('SEARCH_FIRST',sym,'insider_hits=',len(ev.get('insider_search') or []),'deal_hits=',len(ev.get('deal_search') or []),'action_hits=',len(ev.get('action_search') or []))
              print('SEARCH_FIRST',sym,'complete=',v['complete'],'failed=',v['failed'],'score=',r.score,'confidence=',r.confidence)
              assert len(x.price_history)>500
          PY
      - name: Existing fixed NSE adapter diagnostic
        continue-on-error: true
        run: |
          python - <<'PY'
          from cr360.nse_public_adapter import NSEPublicAdapter
          a=NSEPublicAdapter(timeout=20,retries=2)
          p=a('RELIANCE')
          print('NSE public coverage',p['coverage'])
          print('NSE adapter errors',p['adapter_errors'])
          PY
