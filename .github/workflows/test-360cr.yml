name: Test 360CR
on:
  workflow_dispatch:
  push:
    paths:
      - 'cr360/**'
      - 'tests/test_cr360*'
      - 'tests/test_nse_public_adapter.py'
      - '.github/workflows/test-360cr.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest pandas yfinance requests beautifulsoup4 lxml
      - name: Verify package import
        run: python -c "import cr360; print('cr360 import OK:', cr360.__file__)"
      - run: python -m pytest -q tests/test_cr360.py tests/test_cr360_collector.py tests/test_nse_public_adapter.py
      - name: Deep-history candidate diagnostic
        continue-on-error: true
        run: |
          python - <<'PY'
          from cr360.deep_history_collector import collect_deep_history_360cr
          from cr360.validator import validate_360cr_input
          from cr360 import analyse_360cr
          for sym in ('RELIANCE','HDFCBANK'):
              x=collect_deep_history_360cr(sym)
              r=analyse_360cr(x); v=validate_360cr_input(x)
              print('DEEP_HISTORY',sym,'counts=',x.metadata.get('deep_history_counts'))
              print('DEEP_HISTORY',sym,'evidence=',x.metadata.get('deep_history_evidence'))
              print('DEEP_HISTORY',sym,'errors=',x.metadata.get('deep_history_errors'))
              print('DEEP_HISTORY',sym,'periods=',[q.get('period') for q in x.quarterly_financials])
              print('DEEP_HISTORY',sym,'share_periods=',[q.get('period') for q in x.shareholding_quarters])
              print('DEEP_HISTORY',sym,'complete=',v['complete'],'failed=',v['failed'],'score=',r.score,'confidence=',r.confidence)
              assert len(x.price_history)>500
          PY
      - name: Existing search-first candidate diagnostic
        continue-on-error: true
        run: |
          python - <<'PY'
          from cr360.web_discovery_collector import collect_search_first_360cr
          from cr360.validator import validate_360cr_input
          for sym in ('RELIANCE',):
              x=collect_search_first_360cr(sym);v=validate_360cr_input(x)
              print('SEARCH_FIRST_BASELINE',sym,x.metadata.get('search_first_counts'),'complete=',v['complete'])
          PY
