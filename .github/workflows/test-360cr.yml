name: Test 360CR
on:
  workflow_dispatch:
  push:
    paths:
      - 'cr360/**'
      - 'tests/test_cr360*'
      - 'tests/test_nse_public_adapter.py'
      - '.github/workflows/test-360cr.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest pandas yfinance requests beautifulsoup4 lxml
      - name: Verify package import
        run: python -c "import cr360; print('cr360 import OK:', cr360.__file__)"
      - run: python -m pytest -q tests/test_cr360.py tests/test_cr360_collector.py tests/test_nse_public_adapter.py
      - name: Identity-safe candidate diagnostic
        continue-on-error: true
        run: |
          python - <<'PY'
          from cr360.identity_safe_collector import collect_identity_safe_360cr
          from cr360.validator import validate_360cr_input
          from cr360 import analyse_360cr
          for sym in ('RELIANCE','HDFCBANK'):
              x=collect_identity_safe_360cr(sym)
              r=analyse_360cr(x);v=validate_360cr_input(x)
              ev=x.metadata.get('identity_safe_evidence') or {}
              print('IDENTITY_SAFE',sym,'counts=',x.metadata.get('identity_safe_counts'))
              print('IDENTITY_SAFE',sym,'errors=',x.metadata.get('identity_safe_errors'))
              print('IDENTITY_SAFE',sym,'quarter_sweep_sources=',ev.get('quarter_sweep_sources'))
              print('IDENTITY_SAFE',sym,'shareholding_sources=',ev.get('shareholding_sources'))
              print('IDENTITY_SAFE',sym,'insider_sources=',(ev.get('insider_sources') or [])[:3])
              print('IDENTITY_SAFE',sym,'deal_sources=',(ev.get('deal_sources') or [])[:3])
              print('IDENTITY_SAFE',sym,'action_sources=',(ev.get('action_sources') or [])[:3])
              print('IDENTITY_SAFE',sym,'periods=',[q.get('period') for q in x.quarterly_financials])
              print('IDENTITY_SAFE',sym,'share_periods=',[q.get('period') for q in x.shareholding_quarters])
              print('IDENTITY_SAFE',sym,'complete=',v['complete'],'failed=',v['failed'],'score=',r.score,'confidence=',r.confidence)
              assert len(x.price_history)>500
          PY
      - name: Deep-history baseline diagnostic
        continue-on-error: true
        run: |
          python - <<'PY'
          from cr360.deep_history_collector import collect_deep_history_360cr
          from cr360.validator import validate_360cr_input
          x=collect_deep_history_360cr('RELIANCE');v=validate_360cr_input(x)
          print('DEEP_HISTORY_BASELINE',x.metadata.get('deep_history_counts'),'complete=',v['complete'])
          PY
