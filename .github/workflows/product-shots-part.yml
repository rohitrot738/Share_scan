# Temporary: one part of product-shots-all.yml. Removed before merging.
name: Product shots (part)
on:
  workflow_call:
    inputs:
      part:
        type: number
        required: true
permissions:
  contents: write
jobs:
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # the branch as it is now, with the parts before this one
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow
      - run: python .github/product-shots.py part ${{ inputs.part }} 3 app/src/main/assets
      - name: Commit the photos to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf product-shots/photos
          git add -A app/src/main/assets/product-photos app/src/main/assets/product-photos.json product-shots
          git commit -m "Company product photos, part ${{ inputs.part }} of 3" || exit 0
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
