# One-off: which stock-news sources answer, and in what shape. Taken out next commit.
name: News probe
on:
  push:
    branches: [claude/fervent-turing-3b79hv]
    paths: ['.github/workflows/news-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: pip install requests
      - name: Probe
        shell: python
        run: |
          import json, re, time, requests, xml.etree.ElementTree as ET
          MOB = "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Mobile Safari/537.36"
          def show(label, r, n=400):
              print(f"== {label}: {r.status_code} {r.headers.get('content-type')} {len(r.content)}B", flush=True)
              print("   ", r.text[:n].replace("\n", " "), flush=True)
          s = requests.Session()
          s.headers.update({"User-Agent": MOB, "Accept": "*/*", "Accept-Language": "en-IN,en;q=0.9"})
          r = s.get("https://www.nseindia.com/", timeout=20)
          print("nse home", r.status_code, "cookies", sorted(s.cookies.keys()), flush=True)
          ref = {"Referer": "https://www.nseindia.com/companies-listing/corporate-filings-announcements"}
          for q in ("index=equities&from_date=22-10-2026&to_date=23-10-2026", "index=equities&from_date=23-10-2026&to_date=23-10-2026", "index=sme&from_date=22-10-2026&to_date=23-10-2026"):
              t = time.time()
              r = s.get(f"https://www.nseindia.com/api/corporate-announcements?{q}", headers=ref, timeout=60)
              try:
                  data = r.json()
              except Exception:
                  data = []
              descs = {}
              for it in data:
                  descs[it.get("desc")] = descs.get(it.get("desc"), 0) + 1
              print(f"== nse {q}: {r.status_code} {len(r.content)}B {round(time.time()-t,1)}s items {len(data)} symbols {len({it.get('symbol') for it in data})}", flush=True)
              print("    top descs", sorted(descs.items(), key=lambda kv: -kv[1])[:25])
              time.sleep(1)
          # The same without cookies, as a phone's first request would be.
          r = requests.get("https://www.nseindia.com/api/corporate-announcements?index=equities", headers={"User-Agent": MOB, **ref}, timeout=30)
          print("== nse without cookies:", r.status_code, len(r.content), r.text[:120])
          b = requests.Session()
          b.headers.update({"User-Agent": MOB, "Accept": "application/json, text/plain, */*", "Referer": "https://www.bseindia.com/", "Origin": "https://www.bseindia.com"})
          for url in ("https://api.bseindia.com/BseIndiaAPI/api/AnnGetData/w?strCat=-1&strPrevDate=20261023&strScrip=&strSearch=P&strToDate=20261023&strType=C",
                      "https://api.bseindia.com/BseIndiaAPI/api/AnnSubCategoryGetData/w?pageno=1&strCat=-1&strPrevDate=20261023&strScrip=&strSearch=P&strToDate=20261023&strType=C&subcategory=-1",
                      "https://api.bseindia.com/BseIndiaAPI/api/AnnSubCategoryGetData/w?pageno=1&strCat=Result&strPrevDate=20261022&strScrip=&strSearch=P&strToDate=20261023&strType=C&subcategory=-1"):
              r = b.get(url, timeout=30)
              try:
                  data = r.json()
                  table = data.get("Table") or []
                  print("== bse", url[50:120], r.status_code, len(r.content), "items", len(table), "keys", list(data.keys())[:5])
                  for it in table[:2]:
                      print("    ", {k: it.get(k) for k in ("SCRIP_CD", "SLONGNAME", "HEADLINE", "NEWS_DT", "CATEGORYNAME")})
              except Exception as e:
                  print("== bse", url[50:120], r.status_code, repr(e)[:80], r.text[:120])
