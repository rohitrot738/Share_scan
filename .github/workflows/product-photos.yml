# Temporary: finds real pictures for the products section (product-photos.py). A probe on a few well-known companies
# first, stored the way the app carries them, with a contact sheet to check them by eye (product photos named in
# their title, no people or events). Removed before merging.
name: Product photos
on:
  push:
    branches: [claude/fervent-turing-3b79hv]
    paths: ['.github/workflows/product-photos.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow
      - run: python .github/product-photos.py probe ui-profiles $SYMBOLS
        env:
          SYMBOLS: 'MRF APOLLOTYRE CEATLTD BALKRISIND JKTYRE MARUTI M&M BAJAJ-AUTO HEROMOTOCO EICHERMOT ASHOKLEY TVSMOTOR EXIDEIND BOSCHLTD SUNPHARMA CIPLA DRREDDY APOLLOHOSP DABUR HINDUNILVR ITC NESTLEIND BRITANNIA TATACONSUM MARICO COLPAL ASIANPAINT BERGEPAINT ULTRACEMCO AMBUJACEM SUPREMEIND ASTRAL KAJARIACER TATASTEEL JSWSTEEL HINDALCO COALINDIA RELIANCE ONGC NTPC TATAPOWER HAVELLS POLYCAB VOLTAS WHIRLPOOL DIXON BHARTIARTL TCS INFY HDFCBANK ICICIBANK BAJFINANCE SBILIFE TITAN PAGEIND BATAINDIA RELAXO TRENT JUBLFOOD INDHOTEL HAL BEL PIDILITIND UPL CHAMBLFERT BALRAMCHIN VBL UBL PVRINOX VIPIND'
      - name: Commit what was found
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-profiles
          git commit -m "Add product photo probe for review" || exit 0
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
