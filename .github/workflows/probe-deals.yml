name: Probe NSE deal history
# One-off: what NSE's historical bulk/block deal answers look like from a runner. Taken out in the next commit.
on:
  push:
    branches: [claude/fervent-turing-3b79hv]
    paths: ['.github/workflows/probe-deals.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Ask NSE
        run: |
          python - <<'PY'
          import json, time
          from cr360.nse_public_adapter import NSEPublicAdapter
          nse = NSEPublicAdapter(timeout=20, retries=2, sleep=1)
          asks = [
              ("/api/historical/bulk-deals", {"from": "01-10-2026", "to": "22-10-2026"}),
              ("/api/historical/block-deals", {"from": "01-10-2026", "to": "22-10-2026"}),
              ("/api/historical/bulk-deals", {"symbol": "RELIANCE", "from": "23-10-2021", "to": "22-10-2026"}),
              ("/api/historical/bulk-deals", {"from": "23-10-2025", "to": "22-10-2026"}),
              ("/api/historical/bulk-deals", {"from": "23-10-2021", "to": "22-12-2021"}),
              ("/api/historical/block-deals", {"from": "23-10-2025", "to": "22-10-2026"}),
              ("/api/historical/bulk-deals", {"optionType": "bulk_deals", "from": "01-10-2026", "to": "22-10-2026"}),
              ("/api/snapshot-capital-market-largedeal", None),
          ]
          for path, params in asks:
              try:
                  got = nse._get(path, params)
                  rows = nse._rows(got)
                  keys = list(got.keys()) if isinstance(got, dict) else type(got).__name__
                  print("ASK", path, params, "| keys", keys, "| rows", len(rows))
                  for r in rows[:2]:
                      print("  ROW", json.dumps(r, ensure_ascii=False)[:700])
                  if not rows:
                      print("  BODY", json.dumps(got, ensure_ascii=False)[:1500])
                  if rows:
                      dates = sorted({str(nse._pick(r, "BD_DT_DATE", "date", "mTd") or "") for r in rows})
                      print("  DAYS", len(dates), dates[:2], dates[-2:])
              except Exception as e:
                  print("ASK", path, params, "| FAILED", e)
              time.sleep(2)
          PY
