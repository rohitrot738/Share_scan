name: Order Flow Tests
on:
  push:
    branches: [feature/nse-orderflow-footprint-v1]
  pull_request:
    paths:
      - 'orderflow/**'
      - 'tests/test_orderflow_footprint.py'
      - '.github/workflows/orderflow-tests.yml'
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run footprint unit tests
        run: python -m unittest discover -s tests -p 'test_orderflow_*.py' -v
      - name: Run synthetic demo
        run: python -m orderflow.demo
