# Temporary: tries product-shots.py on a few dozen companies and commits contact sheets of the photos it finds, to
# look at before every company is read. Removed before merging.
name: Product shots (probe)
on:
  push:
    branches: [claude/fervent-turing-3b79hv]
    paths: ['.github/product-shots.py', '.github/workflows/product-shots-probe.yml']
permissions:
  contents: write
concurrency:
  group: product-shots-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      SYMBOLS: >-
        HUBTOWN CHEVIOT KERALAYUR SAMAY AMTL ASGARD UTIQUE ORCHPHARMA BAHETI JINDHOT PRIMAPLA APL NEAGI EIFFL ALICON
        AUTOIND LMW KSHITIJPOL ARVEE FILATFASH
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow
      - run: |
          mkdir -p product-shots-probe
          python .github/product-shots.py probe product-shots-probe $SYMBOLS 2>&1 | tee product-shots-probe/log.txt
      - name: Commit the sheets to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q -r --cached product-shots-probe 2>/dev/null || true
          git add product-shots-probe/*.png product-shots-probe/found.json product-shots-probe/log.txt
          git commit -m "Product shots probe: contact sheets" || exit 0
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
