# Temporary: every company's own product photos from its website, stored in the app (product-shots.py part). Each
# company's Screener page is read once more, one page every six seconds, for its website; three parts run one after
# another, NSE companies first, and each commits its photos when it ends. Removed before merging.
name: Product shots (all)
on:
  push:
    branches: [claude/fervent-turing-3b79hv]
    paths: ['.github/workflows/product-shots-all.yml']
permissions:
  contents: write
concurrency:
  group: product-shots-all
  cancel-in-progress: false
jobs:
  part0:
    uses: ./.github/workflows/product-shots-part.yml
    with:
      part: 0
  part1:
    needs: part0
    if: always()
    uses: ./.github/workflows/product-shots-part.yml
    with:
      part: 1
  part2:
    needs: part1
    if: always()
    uses: ./.github/workflows/product-shots-part.yml
    with:
      part: 2
