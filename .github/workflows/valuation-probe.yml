# One-off: where promoter pledges and auditor resignations can be read from NSE. Taken out next commit.
name: Valuation probe
on:
  push:
    branches: [claude/fervent-turing-3b79hv]
    paths: ['.github/workflows/valuation-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: pip install requests
      - name: Probe
        shell: python
        run: |
          import json, time, requests
          MOB = "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Mobile Safari/537.36"
          s = requests.Session()
          s.headers.update({"User-Agent": MOB, "Accept": "application/json, text/plain, */*", "Accept-Language": "en-IN,en;q=0.9"})
          r = s.get("https://www.nseindia.com/", timeout=20, headers={"Accept": "text/html"})
          print("home", r.status_code, sorted(s.cookies.keys()), flush=True)
          def get(label, url, ref="https://www.nseindia.com/companies-listing/corporate-filings-pledged-data", n=600):
              t = time.time()
              try:
                  r = s.get(url, headers={"Referer": ref}, timeout=90)
              except Exception as e:
                  print(f"== {label}: failed {e!r}", flush=True); return None
              print(f"== {label}: {r.status_code} {r.headers.get('content-type')} {len(r.content)}B {round(time.time()-t,1)}s", flush=True)
              print("   ", r.text[:n].replace("\n", " "), flush=True)
              try:
                  return r.json()
              except Exception:
                  return None
          # Promoter pledges: the market-wide list, and one company's.
          for q in ("index=equities", "index=equities&symbol=ADANIPORTS", "index=equities&symbol=JPPOWER"):
              d = get("pledge " + q, "https://www.nseindia.com/api/corporate-pledgedata?" + q)
              rows = d.get("data") if isinstance(d, dict) else d
              if isinstance(rows, list):
                  print("    rows", len(rows), "keys", sorted(rows[0].keys()) if rows else None)
                  for row in rows[:3]: print("    ", json.dumps(row)[:600])
              elif isinstance(d, dict):
                  print("    keys", sorted(d.keys()))
              time.sleep(1)
          # Auditor resignations: a subject filter, then the descriptions over a long span of one category.
          ref = "https://www.nseindia.com/companies-listing/corporate-filings-announcements"
          for q in ("index=equities&from_date=01-01-2026&to_date=27-10-2026&subject=Resignation%20of%20Statutory%20Auditors",
                    "index=equities&from_date=01-07-2026&to_date=27-10-2026&desc=Change%20in%20Auditors",
                    "index=equities&from_date=20-10-2026&to_date=27-10-2026"):
              d = get("ann " + q, "https://www.nseindia.com/api/corporate-announcements?" + q, ref=ref, n=300)
              if isinstance(d, list):
                  descs = {}
                  for it in d: descs[it.get("desc")] = descs.get(it.get("desc"), 0) + 1
                  aud = [it for it in d if "auditor" in (str(it.get("desc")) + " " + str(it.get("attchmntText"))).lower()]
                  print("    items", len(d), "auditor items", len(aud))
                  print("    descs with 'audit':", {k: v for k, v in descs.items() if k and "audit" in k.lower()})
                  for it in aud[:6]: print("     ", it.get("symbol"), "|", it.get("desc"), "|", str(it.get("attchmntText"))[:160])
              time.sleep(1)
          # Shareholding pattern from NSE: does it carry pledged shares?
          d = get("shp RELIANCE", "https://www.nseindia.com/api/corporate-share-holdings-master?index=equities&symbol=RELIANCE",
                  ref="https://www.nseindia.com/companies-listing/corporate-filings-shareholding-pattern", n=500)
          if isinstance(d, list) and d: print("    shp keys", sorted(d[0].keys()))
