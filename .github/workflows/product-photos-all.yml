# Temporary: every company's pictures for the products section, stored in the app (product-photos.py screener). Each
# company's Screener page is read once more, one page every six seconds, for its logo and website; three parts run
# one after another, NSE companies first, and each commits its pictures when it ends. Removed before merging.
name: Product photos (all)
on:
  push:
    branches: [claude/fervent-turing-3b79hv]
    paths: ['.github/workflows/product-photos-all.yml']
permissions:
  contents: write
concurrency:
  group: product-photos-all
  cancel-in-progress: false
jobs:
  part0:
    uses: ./.github/workflows/product-photos-part.yml
    with:
      part: 0
  part1:
    needs: part0
    if: always()
    uses: ./.github/workflows/product-photos-part.yml
    with:
      part: 1
  part2:
    needs: part1
    if: always()
    uses: ./.github/workflows/product-photos-part.yml
    with:
      part: 2
