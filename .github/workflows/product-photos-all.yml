# Temporary: every company's pictures for the products section, stored in the app (product-photos.py all), from the
# profiles the product-data run read. Started by writing that run's id to .github/product-photos-go.txt. Removed
# before merging.
name: Product photos (all)
on:
  push:
    branches: [claude/fervent-turing-3b79hv]
    paths: ['.github/product-photos-go.txt']
permissions:
  contents: write
  actions: read
jobs:
  all:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow
      - name: The product-data run's id
        id: data
        run: echo "run=$(tr -dc 0-9 < .github/product-photos-go.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: product-data-*
          merge-multiple: true
          path: product-data
          run-id: ${{ steps.data.outputs.run }}
          github-token: ${{ github.token }}
      - run: python .github/product-photos.py all product-data app/src/main/assets
      - name: Commit the pictures to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/product-photos app/src/main/assets/product-photos.json
          git commit -m "Pictures for every company's products section, stored in the app" || exit 0
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
