# One-off: runs the valuation framework's new NSE reads and a few stocks' verdicts on live data. Taken out next commit.
name: Framework probe
on:
  push:
    branches: [claude/fervent-turing-3b79hv]
    paths: ['.github/workflows/framework-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Probe
        shell: python
        run: |
          import time
          from datetime import datetime
          from cr360 import app_store, build_app_cache as b, valuation as v
          from cr360.nse_public_adapter import NSEPublicAdapter
          today = datetime.now(b.IST).date()
          universe, markets = b.load_universe(today)
          sectors = b.load_sectors(universe)
          store = app_store.empty()
          nse = NSEPublicAdapter(timeout=30, retries=2, sleep=.5)
          b.top_up_pledges(store, nse, universe)
          pledged = sorted(((s, st["pledge"]) for s, st in store["stocks"].items() if st.get("pledge") is not None), key=lambda x: -x[1])
          print("pledged over 15%:", [(s, p) for s, p in pledged if p > 15][:40], flush=True)
          print("NSE stocks without a pledge row:", sum(1 for s, u in universe.items() if u["market"] == "nse" and s not in dict(pledged)), flush=True)
          t = time.time()
          b.top_up_auditors(store, nse, universe, today, time.time() + 20 * 60)
          print(f"announcements read in {time.time() - t:.0f}s", flush=True)
          resigned = sorted((s, st["auditor_resigned"]) for s, st in store["stocks"].items() if st.get("auditor_resigned"))
          print("auditor resignations:", len(resigned), resigned[:60], flush=True)
          sample = ["HDFCBANK", "ICICIBANK", "SBIN", "BAJFINANCE", "RELIANCE", "TATASTEEL", "ONGC", "COALINDIA", "LT",
                    "MARUTI", "SIEMENS", "TCS", "INFY", "HINDUNILVR", "SUNPHARMA", "ASIANPAINT", "ULTRACEMCO", "DIXON"]
          sample += [s for s, p in pledged if p > 15 and universe.get(s, {}).get("market") == "nse"][:3]
          sample += [s for s, _ in resigned if universe.get(s, {}).get("market") == "nse"][:3]
          screener = b.Screener()
          due = app_store.latest_due_quarter(today)
          for sym in sample:
              got = screener.page(sym, due)
              if not got:
                  print(sym, "no page", flush=True)
                  continue
              app_store.put_page(store, sym, got[0], today, got[1])
              stock = store["stocks"][sym]
              prices = b.yahoo_prices(b.yahoo_tickers(sym, universe[sym]))
              cap = (stock.get("ratios") or {}).get("market_cap_cr") or 0
              mos = v.MOS["large"] if cap >= 100000 else v.MOS["mid"] if cap >= 30000 else v.MOS["small"]
              research = app_store.research_input(sym, stock, prices, None, financial=sectors.get(sym) == b.FINANCIAL_SECTOR,
                                                  sector=sectors.get(sym, ""), mos=mos, today=today)
              rec = app_store.app_record(stock, research)
              fw = research.metadata["framework"]
              print(f"== {sym} [{sectors.get(sym)}] price {research.price} -> {rec and rec['st']} {rec and rec['s']}", flush=True)
              print("   ", {k: (round(x, 2) if isinstance(x, float) else x) for k, x in fw.items()}, flush=True)
              print("   facts", rec and rec["f"], flush=True)
