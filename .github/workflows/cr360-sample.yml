name: R/S sample (temporary)
# Temporary: builds one stock's R/S record with the cache's own code, for a preview. Removed in the next commit.
on:
  push:
    paths:
      - '.github/workflows/cr360-sample.yml'
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: CDSL
        run: |
          python - <<'PY'
          import json, random
          from datetime import datetime, timedelta
          from cr360 import app_store, build_app_cache as b
          from cr360.engine import analyse_360cr
          from cr360.nse_public_adapter import NSEPublicAdapter
          target = "CDSL"
          today = datetime.now(b.IST).date()
          universe, markets = b.load_universe(today)
          sectors = b.load_sectors(universe)
          peers = sorted(s for s, sec in sectors.items() if sec == sectors[target] and s != target and universe[s]["market"] == "nse")
          random.Random(7).shuffle(peers)
          store, screener, due = app_store.empty(), b.Screener(), app_store.latest_due_quarter(today)
          for sym in [target] + peers[:35]:
              u = universe[sym]
              st = store["stocks"].setdefault(sym, {})
              st.update(market=u["market"], code=u["code"])
              got = screener.page(b.screener_slug(sym, st), due)
              if got:
                  app_store.put_page(store, sym, got[0], today, got[1])
              if screener.blocked:
                  break
          nse = NSEPublicAdapter(timeout=15, retries=2, sleep=.5)
          rows = b.insider_events(nse, target, today - timedelta(days=365 * 5), today)
          if rows:
              app_store.put_events(store, target, "insider", rows)
          for sym, rows in b.archive_deals().items():
              if sym in store["stocks"]:
                  app_store.put_events(store, sym, "deals", rows)
          priced = [s for s, v in store["stocks"].items() if v.get("quarters")]
          prices = {s: b.yahoo_prices(b.yahoo_tickers(s, store["stocks"][s])) for s in priced}
          last = {s: r[-1]["close"] if r else (store["stocks"][s].get("ratios") or {}).get("price") for s, r in prices.items()}
          anchors = app_store.sector_anchors(store, last, sectors)
          anchor = anchors.get(sectors.get(target, "")) or anchors.get("")
          stock = store["stocks"][target]
          research = app_store.research_input(target, stock, prices[target], anchor)
          rec = app_store.app_record(stock, research)
          r = analyse_360cr(research)
          monthly = {}
          for row in prices[target]:
              monthly[row["date"][:7]] = round(row["close"], 2)
          print("SAMPLE_ANCHOR", json.dumps({"sector": sectors.get(target), "anchor": anchor, "peers_read": len(priced) - 1, "last": prices[target][-1]["date"] if prices[target] else None}))
          print("SAMPLE_RECORD", json.dumps(rec, ensure_ascii=False))
          print("SAMPLE_RESULT", json.dumps({"fair": r.fair_value, "risk": r.risk, "sections": r.sections, "coverage": r.coverage, "evidence": r.evidence}, default=str))
          print("SAMPLE_STORE", json.dumps(stock, ensure_ascii=False, separators=(",", ":")))
          print("SAMPLE_MONTHLY", json.dumps(monthly))
          PY
