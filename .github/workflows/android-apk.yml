name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ['app/**', 'build.gradle.kts', 'settings.gradle.kts', '.github/workflows/android-apk.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.10.2/bin/gradle" :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: share-scan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
