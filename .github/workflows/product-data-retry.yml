# Temporary: reads again the companies the product-data run 40958982454 missed (its second slice ran out of time),
# then writes the app's products file from every slice and keeps all the profiles in one artifact for the picture
# run. Removed before merging.
name: Product data (missed)
on:
  push:
    branches: [claude/fervent-turing-3b79hv]
    paths: ['.github/workflows/product-data-retry.yml']
permissions:
  contents: write
  actions: read
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - uses: actions/download-artifact@v4
        with:
          pattern: product-data-*
          merge-multiple: true
          path: product-data
          run-id: 40958982454
          github-token: ${{ github.token }}
      - run: python .github/product-data.py retry product-data product-data
      - uses: actions/upload-artifact@v4
        with:
          name: product-data-all
          path: product-data
          retention-days: 90
      - name: Write the app's products file
        run: python .github/product-data.py join product-data app/src/main/assets/products.json | tee product-data-summary.txt
      - name: Commit it to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/products.json product-data-summary.txt
          git commit -m "Products of the companies the first read missed" || exit 0
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
