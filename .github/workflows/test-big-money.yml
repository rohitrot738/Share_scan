name: Test big money
on:
  workflow_dispatch:
  push:
    paths:
      - 'bigmoney/**'
      - 'tests/test_big_money.py'
      - '.github/workflows/test-big-money.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest requests
      - run: python -m pytest -q tests/test_big_money.py
