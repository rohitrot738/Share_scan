name: Release Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, claude/fervent-turing-3b79hv]
    paths: ['app/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', '.github/workflows/android-release.yml']
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check signing secret
        id: secret
        env:
          SHARESCAN_KEY_PASSWORD: ${{ secrets.SHARESCAN_KEY_PASSWORD }}
        run: |
          if [ -z "$SHARESCAN_KEY_PASSWORD" ]; then
            echo "::notice::No release published: add the SHARESCAN_KEY_PASSWORD repository secret (Settings → Secrets and variables → Actions), then re-run this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed release APK
        if: steps.secret.outputs.ready == 'true'
        env:
          SHARESCAN_KEY_PASSWORD: ${{ secrets.SHARESCAN_KEY_PASSWORD }}
        run: |
          # Offset keeps release version codes above the debug builds' versionCode 2.
          export SHARESCAN_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))
          curl -sSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.10.2/bin/gradle" :app:assembleRelease
      - name: Publish GitHub release
        if: steps.secret.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD=$((GITHUB_RUN_NUMBER + 100))
          cp app/build/outputs/apk/release/app-release.apk ShareScan.apk
          gh release create "v1.2.$BUILD" ShareScan.apk \
            --target "$GITHUB_SHA" \
            --title "Share Scan 1.2.$BUILD" \
            --latest \
            --notes "Phone par install karne ke liye ShareScan.apk download karein. Har release ek hi permanent key se sign hai, isliye naya version purane ke upar install ho jata hai. Hamesha latest: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/ShareScan.apk"
