# Temporary: runs the released APKs on an emulator to find where the app crashes. Removed before merging.
name: Crash hunt
on:
  push:
    branches: [claude/fervent-turing-3b79hv]
    paths: ['.github/crash-hunt.sh', '.github/workflows/crash-hunt.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crash-hunt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: The released APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.2.145 -p ShareScan.apk -O old.apk
          gh release download v1.2.147 -p ShareScan.apk -O new.apk
          ls -la old.apk new.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/crash-hunt.sh
      - name: Commit the findings to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crash-hunt
          git commit -m "Add crash hunt findings" || exit 0
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
