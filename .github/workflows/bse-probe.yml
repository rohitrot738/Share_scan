# One-off: why BSE's bhavcopy answers 404 from runners, and what else lists BSE's shares. Taken out next commit.
name: BSE probe
on:
  push:
    branches: [claude/fervent-turing-3b79hv]
    paths: ['.github/workflows/bse-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe
        shell: python
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          import http.client, urllib.request, urllib.error
          from cr360 import build_app_cache as b
          U = b.BSE_BHAVCOPY.format("20261022")
          MOB = b.BROWSER_UA
          REF = "https://www.bseindia.com/"
          def t(label, h):
              try:
                  with urllib.request.urlopen(urllib.request.Request(U, headers=h), timeout=40) as r:
                      print(label, r.status, len(r.read()), flush=True)
              except urllib.error.HTTPError as e:
                  print(label, e.code, flush=True)
          for round in (1, 2):
              t("urllib ua+ref", {"User-Agent": MOB, "Referer": REF})
              t("urllib +accept csv", {"User-Agent": MOB, "Referer": REF, "Accept": "text/csv"})
              t("urllib +accept-language", {"User-Agent": MOB, "Referer": REF, "Accept-Language": "en-IN,en;q=0.9"})
              t("urllib all three", {"User-Agent": MOB, "Referer": REF, "Accept": "text/csv", "Accept-Language": "en-IN,en;q=0.9"})
              for name in ("Accept-Language", "Accept-language"):
                  c = http.client.HTTPSConnection("www.bseindia.com", timeout=40)
                  c.putrequest("GET", U.split("bseindia.com")[1])
                  for k, v in (("User-Agent", MOB), ("Referer", REF), ("Accept", "text/csv"), (name, "en-IN,en;q=0.9")):
                      c.putheader(k, v)
                  c.endheaders()
                  r = c.getresponse()
                  print(f"http.client {name}", r.status, len(r.read()), flush=True)
              s, text, _ = b.http_get(U, "text/csv", b.BROWSER_UA, 60, REF)
              print("builder http_get", s, len(text), len(b.bse_listings(text)) if s == 200 else 0, flush=True)
