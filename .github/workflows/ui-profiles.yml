# Temporary: reads the About and Key Points of a few well-known companies from Screener, to check what products the
# classifier finds in real text. Removed before merging.
name: Product profiles
on:
  push:
    branches: [claude/fervent-turing-3b79hv]
    paths: ['.github/workflows/ui-profiles.yml']
permissions:
  contents: write
jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read the profiles
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p ui-profiles
          python .github/ui-products.py "$RUNNER_TEMP/cr360.json.gz" ui-profiles/products.txt ui-profiles/profiles.json
      - name: Commit them to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-profiles
          git commit -m "Add product profiles for review" || exit 0
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
