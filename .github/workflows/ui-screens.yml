# Temporary: renders the app on an emulator to review the sheet of a share without a chart and the brands window.
# Removed before merging.
name: UI screenshots
on:
  push:
    branches: [claude/fervent-turing-3b79hv]
    paths: ['.github/ui-screens.sh', '.github/workflows/ui-screens.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ui-screens-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: बड़े पैसे की चाल's file from this branch (with each new listing's sessions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install requests
          gh release download cr360-data -p big-money-store.json.gz -p big-money.json.gz -D /tmp/bm
          python - <<'PY'
          import gzip, json
          from bigmoney.build import app_file, write_json_gz
          store = json.load(gzip.open("/tmp/bm/big-money-store.json.gz", "rt"))
          kept = json.load(gzip.open("/tmp/bm/big-money.json.gz", "rt"))
          app = app_file(store, {}, record=kept["record"])
          app["pu"] = kept.get("pu")
          for symbol, row in kept["stocks"].items():
              if symbol in app["stocks"]:
                  app["stocks"][symbol]["pn"] = row.get("pn")  # the promoters as published
          write_json_gz("ui-big-money.json.gz", app)
          print(app["date"], len(app["stocks"]), sum("ns" in v for v in app["stocks"].values()))
          PY
      - name: Build debug APK
        env:
          SHARESCAN_VERSION_CODE: '147'  # the version this change will release as, for the header
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.10.2/bin/gradle" :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/ui-screens.sh
      - name: Commit screenshots to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-screens
          git commit -m "Add emulator UI screenshots for review" || exit 0
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
