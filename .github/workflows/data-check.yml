# Temporary: finds which Yahoo ticker form NSE SME (Emerge) stocks use. Remove before merging.
name: NSE data check
on:
  push:
    branches: [claude/fervent-turing-3b79hv]
    paths: ['.github/workflows/data-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Yahoo ticker forms for SME stocks
        run: |
          set +e
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Mobile Safari/537.36"
          curl -sSL -m 30 -A "$UA" -o sme.csv -w "sme list %{http_code}\n" https://nsearchives.nseindia.com/emerge/corporates/content/SME_EQUITY_L.csv
          [ -s sme.csv ] || curl -sSL -m 30 -A "$UA" -o sme.csv -w "sme list (archives) %{http_code}\n" https://archives.nseindia.com/emerge/corporates/content/SME_EQUITY_L.csv
          echo "sme rows: $(($(wc -l < sme.csv) - 1))"
          closes() {
            curl -s -m 15 -A "ShareScan/1.0 (Android)" -o y.json "https://query1.finance.yahoo.com/v8/finance/chart/$1?range=3mo&interval=1d"
            python3 -c "import json;d=json.load(open('y.json'));r=(d.get('chart') or {}).get('result') or [];q=r[0]['indicators']['quote'][0] if r else {};print(sum(1 for c in (q.get('close') or []) if c is not None))" 2>/dev/null || echo 0
          }
          for s in ALCODIS EVENTIONS TEJA SHANTIINOR MPEL NEOCHEM POOJALOGIS AKANKSHA CONNPLEX RNPL; do
            line="$s:"
            for t in "$s.NS" "$s-SM.NS" "$s-ST.NS" "$s.BO" "$s-SM.BO"; do line="$line $t=$(closes "$t")"; done
            hit=$(curl -s -m 15 -A "$UA" "https://query1.finance.yahoo.com/v1/finance/search?q=$s&quotesCount=3&newsCount=0" | python3 -c "import json,sys;d=json.load(sys.stdin);print(','.join(q.get('symbol','') for q in d.get('quotes',[])))" 2>/dev/null)
            echo "$line search=[$hit]"
          done
          echo "== full SME coverage with plain .NS"
          ok=0; n=0
          for s in $(tail -n +2 sme.csv | cut -d, -f1); do
            n=$((n+1)); c=$(closes "$s.NS"); [ "${c:-0}" -ge 21 ] && ok=$((ok+1))
          done
          echo "SME .NS with >=21 closes: $ok / $n"
