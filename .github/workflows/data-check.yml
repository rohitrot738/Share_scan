# Temporary: counts NSE main-board and SME listings and checks Yahoo coverage of SME symbols. Remove before merging.
name: NSE data check
on:
  push:
    branches: [claude/fervent-turing-3b79hv]
    paths: ['.github/workflows/data-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Count listings and sample Yahoo
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Mobile Safari/537.36"
          fetch() { curl -sSL -m 30 -A "$UA" -H "Referer: https://www.nseindia.com/" -o "$2" -w "$1 -> %{http_code} %{size_download} bytes\n" "$1" || true; }
          fetch https://archives.nseindia.com/content/equities/EQUITY_L.csv main.csv
          fetch https://nsearchives.nseindia.com/emerge/corporates/content/SME_EQUITY_L.csv sme1.csv
          fetch https://archives.nseindia.com/emerge/corporates/content/SME_EQUITY_L.csv sme2.csv
          for f in main.csv sme1.csv sme2.csv; do echo "== $f"; head -c 400 "$f" | head -3; echo; echo "rows: $(($(wc -l < "$f") - 1))"; done
          echo "== main series"; tail -n +2 main.csv | cut -d, -f3 | sort | uniq -c | sort -rn | head
          SME=sme1.csv; [ -s sme1.csv ] && head -1 sme1.csv | grep -qi symbol || SME=sme2.csv
          echo "== sme series"; tail -n +2 "$SME" | awk -F, '{print $3}' | sort | uniq -c | sort -rn | head
          echo "== yahoo coverage of 25 SME symbols"
          ok=0; n=0
          for s in $(tail -n +2 "$SME" | cut -d, -f1 | tr -d '"' | shuf -n 25 --random-source=<(yes)); do
            n=$((n+1))
            code=$(curl -s -m 15 -A "ShareScan/1.0 (Android)" -o y.json -w "%{http_code}" "https://query1.finance.yahoo.com/v8/finance/chart/$s.NS?range=3mo&interval=1d")
            pts=$(python3 -c "import json;d=json.load(open('y.json'));r=(d.get('chart') or {}).get('result') or [];q=r[0]['indicators']['quote'][0] if r else {};print(sum(1 for c in (q.get('close') or []) if c is not None))" 2>/dev/null || echo 0)
            echo "$s http=$code closes=$pts"
            [ "${pts:-0}" -ge 21 ] && ok=$((ok+1))
          done
          echo "SME symbols with >=21 daily closes on Yahoo: $ok / $n"
          echo "== yahoo coverage of 25 main-board symbols"
          ok=0; n=0
          for s in $(tail -n +2 main.csv | cut -d, -f1 | tr -d '"' | shuf -n 25 --random-source=<(yes)); do
            n=$((n+1))
            curl -s -m 15 -A "ShareScan/1.0 (Android)" -o y.json "https://query1.finance.yahoo.com/v8/finance/chart/$s.NS?range=3mo&interval=1d"
            pts=$(python3 -c "import json;d=json.load(open('y.json'));r=(d.get('chart') or {}).get('result') or [];q=r[0]['indicators']['quote'][0] if r else {};print(sum(1 for c in (q.get('close') or []) if c is not None))" 2>/dev/null || echo 0)
            [ "${pts:-0}" -ge 21 ] && ok=$((ok+1))
          done
          echo "Main-board symbols with >=21 daily closes on Yahoo: $ok / $n"
