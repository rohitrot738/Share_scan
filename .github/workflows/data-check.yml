# Temporary: checks BSE's scrip list sources and Yahoo coverage of BSE-only stocks. Remove before merging.
name: NSE data check
on:
  push:
    branches: [claude/fervent-turing-3b79hv]
    paths: ['.github/workflows/data-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe BSE lists and Yahoo .BO coverage
        run: |
          set +e
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Mobile Safari/537.36"
          curl -sSL -m 30 -A "$UA" -o main.csv https://archives.nseindia.com/content/equities/EQUITY_L.csv
          curl -sSL -m 30 -A "$UA" -o sme.csv https://nsearchives.nseindia.com/emerge/corporates/content/SME_EQUITY_L.csv
          echo "== BSE ListofScripData API"
          curl -sS -m 60 -A "$UA" -H "Referer: https://www.bseindia.com/" -H "Origin: https://www.bseindia.com" -H "Accept: application/json, text/plain, */*" \
            -o bse.json -w "http %{http_code} %{size_download} bytes\n" \
            "https://api.bseindia.com/BseIndiaAPI/api/ListofScripData/w?Group=&Scripcode=&industry=&segment=Equity&status=Active"
          head -c 600 bse.json; echo
          for d in 0 1 2 3 4 5 6; do
            day=$(date -u -d "-$d day" +%Y%m%d)
            url="https://www.bseindia.com/download/BhavCopy/Equity/BhavCopy_BSE_CM_0_0_0_${day}_F_0000.CSV"
            code=$(curl -sS -m 30 -A "$UA" -H "Referer: https://www.bseindia.com/" -o bhav.csv -w "%{http_code}" "$url")
            echo "bhavcopy $day -> $code $(wc -c < bhav.csv) bytes"
            [ "$code" = "200" ] && [ "$(wc -c < bhav.csv)" -gt 10000 ] && break
          done
          head -3 bhav.csv
          python3 - <<'PY'
          import csv, json, random, subprocess, urllib.request
          def rows(path):
              try:
                  with open(path, encoding="utf-8-sig") as f: return list(csv.DictReader(f))
              except Exception as e: print("read fail", path, e); return []
          nse = rows("main.csv"); sme = rows("sme.csv")
          isin = lambda r: (r.get(" ISIN NUMBER") or r.get("ISIN NUMBER") or r.get("ISIN_NUMBER") or "").strip()
          nse_isins = {isin(r) for r in nse} | {isin(r) for r in sme}
          print("nse isins", len(nse_isins))
          bse = []
          try:
              data = json.load(open("bse.json"))
              print("api rows", len(data), "keys", list(data[0].keys()) if data else None)
              for r in data:
                  bse.append(dict(id=(r.get("scrip_id") or "").strip(), code=str(r.get("SCRIP_CD") or "").strip(),
                                  isin=(r.get("ISIN_NUMBER") or "").strip(), group=(r.get("GROUP") or "").strip(),
                                  name=(r.get("Issuer_Name") or r.get("Scrip_Name") or "").strip()))
          except Exception as e:
              print("api parse fail", e)
          bhav = rows("bhav.csv")
          if bhav:
              print("bhav rows", len(bhav), "keys", list(bhav[0].keys())[:20])
              eq = [r for r in bhav if (r.get("SctySrs") or "").strip() not in ("F", "G", "IF", "IT", "MT", "DT", "GS")]
              print("bhav groups", sorted({(r.get("SctySrs") or "").strip() for r in bhav})[:40])
              if not bse:
                  bse = [dict(id=r["TckrSymb"].strip(), code=r["FinInstrmId"].strip(), isin=r["ISIN"].strip(),
                              group=r["SctySrs"].strip(), name=r["FinInstrmNm"].strip()) for r in eq]
          only = [r for r in bse if r["isin"] and r["isin"] not in nse_isins]
          print("bse total", len(bse), "bse-only (isin not on NSE)", len(only))
          from collections import Counter
          print("bse-only groups", Counter(r["group"] for r in only).most_common(15))
          random.seed(7)
          sample = random.sample(only, min(40, len(only)))
          ok_id = ok_code = 0
          def closes(t):
              req = urllib.request.Request(f"https://query1.finance.yahoo.com/v8/finance/chart/{t}?range=3mo&interval=1d", headers={"User-Agent": "ShareScan/1.0 (Android)"})
              try:
                  d = json.load(urllib.request.urlopen(req, timeout=15))
                  r = d["chart"]["result"][0]["indicators"]["quote"][0]
                  return sum(1 for c in r.get("close") or [] if c is not None)
              except Exception: return 0
          for r in sample:
              a = closes(r["id"] + ".BO"); b = closes(r["code"] + ".BO") if a < 21 else a
              ok_id += a >= 21; ok_code += b >= 21
              print(r["group"], r["id"], r["code"], "id.BO", a, "code.BO", b)
          print(f"yahoo id.BO >=21: {ok_id}/{len(sample)}; with code fallback: {ok_code}/{len(sample)}")
          PY
