name: SUPERFAST BULK-FIRST Market Scan

on:
  workflow_dispatch:
    inputs:
      top:
        description: Number of final candidates
        required: false
        default: "100"
      shortlist:
        description: Bulk-first shortlist size
        required: false
        default: "130"
      market:
        description: nse, bse, or both
        required: false
        default: "both"
  push:
    branches: [main]
    paths: ["scan_trigger.txt"]
  issues:
    types: [opened]

concurrency:
  group: superfast-bulk-first-scan
  cancel-in-progress: true

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[SCAN]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate scanner
        run: |
          python -m compileall -q .
          python -c "import live_scan, market_data; print('bulk-first imports ok')"
      - name: Run SUPERFAST BULK-FIRST scanner
        shell: bash
        run: |
          TOP="${{ github.event.inputs.top || '100' }}"
          SHORTLIST="${{ github.event.inputs.shortlist || '130' }}"
          MARKET="${{ github.event.inputs.market || 'both' }}"
          FLAGS=""
          if [ "$MARKET" = "nse" ]; then FLAGS="--nse-only"; fi
          if [ "$MARKET" = "bse" ]; then FLAGS="--bse-only"; fi
          python live_scan.py --top "$TOP" --shortlist "$SHORTLIST" --batch-size 700 $FLAGS
      - name: Upload SUPERFAST BULK-FIRST results
        uses: actions/upload-artifact@v4
        with:
          name: superfast-bulk-first-results
          path: scan_output/
          if-no-files-found: error
          retention-days: 14
