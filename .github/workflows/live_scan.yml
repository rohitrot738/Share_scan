name: 30-SECOND Market Scan

on:
  workflow_dispatch:
    inputs:
      top:
        description: Number of final candidates
        required: false
        default: "100"
      shortlist:
        description: Full-market shortlist size
        required: false
        default: "500"
      market:
        description: nse, bse, or both
        required: false
        default: "both"
  push:
    branches: [main]
    paths: ["scan_trigger.txt"]
  issues:
    types: [opened]

concurrency:
  group: 30-second-market-scan
  cancel-in-progress: true

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[SCAN]'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
      SCAN_TARGET_SECONDS: "30"
      SCAN_DEEP_LIMIT: "120"
      SCAN_DEPTH_LIMIT: "10"
      SCAN_STAGE1_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate 30-second scanner
        run: |
          python -m compileall -q .
          python -c "import live_scan, market_data; print('30-second mode imports ok')"
      - name: Run 30-SECOND scanner
        shell: bash
        run: |
          TOP="${{ github.event.inputs.top || '100' }}"
          SHORTLIST="${{ github.event.inputs.shortlist || '500' }}"
          MARKET="${{ github.event.inputs.market || 'both' }}"
          FLAGS=""
          if [ "$MARKET" = "nse" ]; then FLAGS="--nse-only"; fi
          if [ "$MARKET" = "bse" ]; then FLAGS="--bse-only"; fi
          python live_scan.py --top "$TOP" --shortlist "$SHORTLIST" --batch-size 1200 $FLAGS
      - name: Upload 30-SECOND results
        uses: actions/upload-artifact@v4
        with:
          name: 30-second-share-scan-results
          path: scan_output/
          if-no-files-found: error
          retention-days: 14
