name: FAST MODE Market Scan

on:
  workflow_dispatch:
    inputs:
      top:
        description: Number of final candidates
        required: false
        default: "100"
      shortlist:
        description: FAST stage-1 shortlist size
        required: false
        default: "140"
      market:
        description: nse, bse, or both
        required: false
        default: "both"
  push:
    branches: [main]
    paths: ["scan_trigger.txt"]
  issues:
    types: [opened]
  pull_request:
    paths: ["*.py", "requirements.txt", ".github/workflows/live_scan.yml"]

concurrency:
  group: fast-mode-market-scan
  cancel-in-progress: true

jobs:
  smoke-test:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[SCAN]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: FAST MODE checks
        run: |
          python -m compileall -q .
          python -c "import market_data, live_scan, groww_orderbook, ghost_trade_core, multi_timeframe; print('FAST MODE imports ok')"

  scan:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[SCAN]'))
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
      FAST_SCAN_WORKERS: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run FAST MODE scanner
        shell: bash
        run: |
          TOP="${{ github.event.inputs.top || '100' }}"
          SHORTLIST="${{ github.event.inputs.shortlist || '140' }}"
          MARKET="${{ github.event.inputs.market || 'both' }}"
          FLAGS=""
          if [ "$MARKET" = "nse" ]; then FLAGS="--nse-only"; fi
          if [ "$MARKET" = "bse" ]; then FLAGS="--bse-only"; fi
          python live_scan.py --top "$TOP" --shortlist "$SHORTLIST" --batch-size 300 --workers 8 $FLAGS
      - name: Upload FAST MODE results
        uses: actions/upload-artifact@v4
        with:
          name: fast-mode-share-scan-results
          path: scan_output/
          if-no-files-found: error
          retention-days: 14
