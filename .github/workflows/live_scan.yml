name: 30-SECOND NSE Market Scan

on:
  workflow_dispatch:
    inputs:
      top:
        description: Number of final candidates
        required: false
        default: "100"
      shortlist:
        description: NSE shortlist size
        required: false
        default: "500"
  push:
    branches: [main]
    paths: ["scan_trigger.txt"]
  issues:
    types: [opened]

concurrency:
  group: 30-second-nse-market-scan
  cancel-in-progress: true

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[SCAN]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
      SCAN_TARGET_SECONDS: "30"
      SCAN_DEEP_LIMIT: "120"
      SCAN_DEPTH_LIMIT: "10"
      SCAN_STAGE1_WORKERS: "4"
      SCAN_CACHE_DIR: ".scan_cache"
      CACHE_BATCH_SIZE: "300"
      CACHE_BATCH_SLEEP: "2.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore scanner cache
        uses: actions/cache@v4
        with:
          path: .scan_cache
          key: nse-scan-cache-${{ github.run_id }}
          restore-keys: |
            nse-scan-cache-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate scanner
        run: |
          python -m compileall -q .
          python -c "import live_scan, market_data; print('NSE scanner imports ok')"
      - name: Build NSE cache when missing
        shell: bash
        run: |
          if [ ! -f .scan_cache/nse_stage1.csv ]; then
            echo "No reusable NSE cache found; building it now..."
            python build_nse_cache.py
          else
            echo "Reusable NSE cache found."
          fi
          python -c "import pandas as pd; d=pd.read_csv('.scan_cache/nse_stage1.csv'); print('cache rows',len(d)); assert len(d)>=500"
      - name: Run 30-SECOND NSE scanner
        shell: bash
        run: |
          TOP="${{ github.event.inputs.top || '100' }}"
          SHORTLIST="${{ github.event.inputs.shortlist || '500' }}"
          python live_scan.py --top "$TOP" --shortlist "$SHORTLIST"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: 30-second-nse-share-scan-results
          path: scan_output/
          if-no-files-found: error
          retention-days: 14
