name: NSE Scanner

on:
  workflow_dispatch:
    inputs:
      top:
        description: Number of final candidates
        required: false
        default: "100"
      shortlist:
        description: NSE shortlist size
        required: false
        default: "500"
  push:
    branches:
      - main
      - 'indicator/**'
      - 'filter/**'
    paths:
      - 'scan_trigger.txt'
      - 'active_indicator.txt'
      - 'indicators.py'
      - 'pattern_engine.py'
      - 'scoring_engine.py'
      - 'multi_timeframe.py'
      - 'live_scan.py'
      - 'build_nse_cache.py'
      - 'market_cap.py'
      - 'tests/test_market_cap_filter.py'
      - '.github/workflows/live_scan.yml'
  issues:
    types: [opened]

concurrency:
  group: nse-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[SCAN]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
      SCAN_TARGET_SECONDS: "30"
      SCAN_DEEP_LIMIT: "120"
      SCAN_DEPTH_LIMIT: "10"
      SCAN_STAGE1_WORKERS: "4"
      SCAN_CACHE_DIR: ".scan_cache"
      CACHE_BATCH_SIZE: "300"
      CACHE_BATCH_SLEEP: "2.0"
      MIN_MARKET_CAP_CR: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore scanner cache
        uses: actions/cache@v4
        with:
          path: .scan_cache
          key: nse-scan-cache-mcap1000-${{ github.run_id }}
          restore-keys: |
            nse-scan-cache-mcap1000-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate scanner
        run: |
          python -m compileall -q .
          python -c "import live_scan, market_data; from scoring_engine import active_indicator; print('NSE scanner imports ok; active=', active_indicator())"
      - name: Build NSE cache when missing stale or invalid
        shell: bash
        run: |
          mkdir -p .scan_cache
          if python -c "import live_scan; assert live_scan.cache_is_valid(500)"; then
            echo "Reusable market-cap-filtered NSE cache found."
          else
            echo "Cache missing, stale, or lacks the >1000 crore filter; rebuilding..."
            python build_nse_cache.py
          fi
          test -s .scan_cache/nse_stage1.csv
          python -c "import live_scan; assert live_scan.cache_is_valid(500); print('market-cap-filtered cache valid')"
      - name: Run NSE scanner
        shell: bash
        run: |
          TOP="${{ github.event.inputs.top || '100' }}"
          SHORTLIST="${{ github.event.inputs.shortlist || '500' }}"
          python live_scan.py --top "$TOP" --shortlist "$SHORTLIST"
      - name: Upload NSE results
        uses: actions/upload-artifact@v4
        with:
          name: nse-scanner-results-${{ github.run_id }}
          path: scan_output/
          if-no-files-found: error
          retention-days: 14
