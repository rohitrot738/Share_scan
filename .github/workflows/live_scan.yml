name: Live Market Scan

on:
  workflow_dispatch:
    inputs:
      top:
        description: Number of final candidates
        required: false
        default: "100"
      shortlist:
        description: Stage-1 shortlist size
        required: false
        default: "300"
      market:
        description: nse, bse, or both
        required: false
        default: "both"
  pull_request:
    paths:
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/live_scan.yml"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q .
      - name: Import check
        run: python -c "import market_data, live_scan, groww_orderbook, ghost_trade_core, multi_timeframe; print('imports ok')"

  scan:
    if: github.event_name == 'workflow_dispatch'
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run scanner
        shell: bash
        run: |
          TOP="${{ github.event.inputs.top || '100' }}"
          SHORTLIST="${{ github.event.inputs.shortlist || '300' }}"
          MARKET="${{ github.event.inputs.market || 'both' }}"
          FLAGS=""
          if [ "$MARKET" = "nse" ]; then FLAGS="--nse-only"; fi
          if [ "$MARKET" = "bse" ]; then FLAGS="--bse-only"; fi
          python live_scan.py --top "$TOP" --shortlist "$SHORTLIST" $FLAGS
      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: share-scan-results
          path: scan_output/
          if-no-files-found: error
          retention-days: 14
