# Temporary: saves Screener/NSE samples as test fixtures and measures Screener's pacing. Remove before merging.
name: Probe 360CR fixtures
on:
  push:
    branches: [claude/fervent-turing-3b79hv]
    paths: ['.github/probe-cr360-fixtures.py', '.github/workflows/probe-cr360-fixtures.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/probe-cr360-fixtures.py
      - name: Commit the fixtures to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/cr360
          git commit -m "Add 360CR test fixtures (Screener and NSE samples)" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
