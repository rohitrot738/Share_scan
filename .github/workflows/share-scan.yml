name: Share Scan

on:
  workflow_dispatch:
    inputs:
      min_market_cap_cr:
        description: Strict minimum market cap in crore
        required: false
        default: "1000"
      min_cr360_score:
        description: Minimum 360CR score
        required: false
        default: "62"
      min_rvol20:
        description: Minimum 20-day relative volume
        required: false
        default: "1.5"
      min_ghost_score:
        description: Minimum Ghost score after READY or CONFIRMED
        required: false
        default: "80"
      max_false_breakout_risk:
        description: Maximum false-breakout risk
        required: false
        default: "35"
      cr360_workers:
        description: Parallel 360CR collectors
        required: false
        default: "8"
      ghost_limit:
        description: Stage-3 Ghost cap; 0 means every volume pass
        required: false
        default: "0"
  push:
    branches:
      - 'filter/**'
    paths:
      - '.github/workflows/share-scan.yml'
      - 'ordered_scan.py'
      - 'market_cap.py'
      - 'scanner.py'
      - 'cr360/**'
      - 'ghost_pro/**'
      - 'tests/test_ordered_scan.py'
      - 'tests/test_market_cap_filter.py'
  issues:
    types: [opened]

concurrency:
  group: share-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[RUN]'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Validate ordered scanner imports and gates
        run: |
          python -m py_compile ordered_scan.py scanner.py market_cap.py ghost_pro/*.py cr360/*.py
          python - <<'PY'
          from ordered_scan import PROCESS_ORDER
          assert PROCESS_ORDER == [
              'market_cap', 'cr360', 'volume', 'ghost_ready_confirmed',
              'ghost_score', 'timeframes', 'false_breakout', 'valid_entry',
              'zero_advanced_veto',
          ]
          print('ordered scanner imports OK:', ' -> '.join(PROCESS_ORDER))
          PY
          python -m pytest -q tests/test_ordered_scan.py tests/test_market_cap_filter.py
      - name: Run ordered full-market scanner
        run: |
          python ordered_scan.py \
            --min-market-cap-cr "${{ github.event.inputs.min_market_cap_cr || '1000' }}" \
            --min-cr360-score "${{ github.event.inputs.min_cr360_score || '62' }}" \
            --min-rvol20 "${{ github.event.inputs.min_rvol20 || '1.5' }}" \
            --min-ghost-score "${{ github.event.inputs.min_ghost_score || '80' }}" \
            --max-false-breakout-risk "${{ github.event.inputs.max_false_breakout_risk || '35' }}" \
            --cr360-workers "${{ github.event.inputs.cr360_workers || '8' }}" \
            --ghost-limit "${{ github.event.inputs.ghost_limit || '0' }}" \
            --output-dir ordered_scan_results
      - name: Verify ordered results
        run: |
          python - <<'PY'
          import json, math
          p=json.load(open('ordered_scan_results/ordered_scan_summary.json'))
          assert p['process_order'] == [
              'market_cap', 'cr360', 'volume', 'ghost_ready_confirmed',
              'ghost_score', 'timeframes', 'false_breakout', 'valid_entry',
              'zero_advanced_veto',
          ]
          assert all(r['ghost_state'] in {'READY','CONFIRMED'} for r in p['stage4_ready_confirmed'])
          assert all(float(r['ghost_score']) >= float(p['thresholds']['min_ghost_score']) for r in p['stage5_ghost_score'])
          for r in p['final_pass']:
              used=set(str(r['timeframes_used']).split(','))
              assert {'15m','1h','1d'} <= used
              assert float(r['false_breakout_risk']) <= float(p['thresholds']['max_false_breakout_risk'])
              assert float(r['stop']) < float(r['entry']) < float(r['target1']) <= float(r['target2'])
              assert int(r['advanced_veto_count']) == 0
          print('ORDERED SCAN VERIFIED:', p['counts'])
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ordered-share-scan-results
          path: ordered_scan_results/
          if-no-files-found: error
          retention-days: 14
