name: Share Scan

on:
  workflow_dispatch:
    inputs:
      top:
        description: Final ranked stocks
        required: false
        default: "100"
      shortlist:
        description: Stage-1 candidates retained
        required: false
        default: "300"
      deep:
        description: Candidates receiving full Ghost analysis
        required: false
        default: "120"
      market:
        description: NSE, BSE or ALL
        required: false
        default: "NSE"
      universe_limit:
        description: Optional universe cap; 0 means full selected market
        required: false
        default: "0"
  issues:
    types: [opened]

concurrency:
  group: share-scan
  cancel-in-progress: true

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[RUN]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python native/build_native.py
      - name: Validate scanner Ghost and 360CR imports
        run: |
          python -m py_compile scanner.py ghost_pro/*.py cr360/*.py
          python - <<'PY'
          import scanner, cr360
          from ghost_pro.ultimate_engine import multi_timeframe
          from ghost_pro.case_training_fusion import fuse_with_technical
          from cr360.scan_integration import enrich_file
          from cr360.nse_public_adapter import NSEPublicAdapter
          print('scanner + full Ghost + full 360CR imports OK')
          PY
      - name: Run full-market Ghost volume scanner
        run: |
          TOP="${{ github.event.inputs.top || '100' }}"
          SHORTLIST="${{ github.event.inputs.shortlist || '300' }}"
          DEEP="${{ github.event.inputs.deep || '120' }}"
          MARKET="${{ github.event.inputs.market || 'NSE' }}"
          LIMIT="${{ github.event.inputs.universe_limit || '0' }}"
          python scanner.py --market "$MARKET" --top "$TOP" --shortlist "$SHORTLIST" --deep "$DEEP" --limit "$LIMIT" --output-dir scan_results
      - name: Enrich same scan with full 360CR
        run: python -m cr360.scan_integration
      - name: Verify integrated result
        run: |
          python - <<'PY'
          import json
          p=json.load(open('scan_results/latest.json'))
          assert p['successful'] == p['requested'], f"incomplete result: {p['successful']}/{p['requested']}"
          assert p['ghost_successful'] == p['successful'], f"Ghost incomplete: {p['ghost_successful']}/{p['successful']}"
          assert p.get('speed_modes_enabled') is False, 'speed mode unexpectedly enabled'
          assert p.get('cr360_integrated') is True, '360CR not integrated'
          assert p.get('cr360_successful') == p['successful'], f"360CR collector failures: {p.get('cr360_errors')}"
          states={r.get('ghost_state') for r in p['ranked']}; allowed={'CONFIRMED','READY','EARLY','WATCH','IGNORE','AVOID'}
          assert states <= allowed, f'unexpected Ghost states: {states-allowed}'
          for r in p['ranked']:
            assert 'cr360_state' in r and 'cr360_confidence' in r and 'cr360_complete' in r
          print('VERIFIED FULL-MARKET GHOST + VOLUME + 360CR:', p['successful'])
          PY
      - name: Export integrated CSV
        run: |
          python - <<'PY'
          import json,pandas as pd
          p=json.load(open('scan_results/latest.json'))
          rows=[]
          for r in p['ranked']:
            x={k:v for k,v in r.items() if k not in ('ghost_details','cr360_evidence','cr360_sections','cr360_coverage','cr360_risk','cr360_fair_value')}
            rows.append(x)
          pd.DataFrame(rows).to_csv('scan_results/latest_integrated.csv',index=False)
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: share-scan-results
          path: scan_results/
          if-no-files-found: error
          retention-days: 14
