name: Share Scan Staged

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of NSE symbols to scan
        required: false
        default: "20"
  issues:
    types: [opened]

concurrency:
  group: share-scan-staged
  cancel-in-progress: true

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[RUN]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate staged code
        run: |
          python -m py_compile scanner.py false_breakout_filter.py demand_supply.py
          python -c "import scanner; from false_breakout_filter import false_breakout_risk; from demand_supply import detect_zones; print('staged scanner imports OK')"
      - name: Run staged NSE scanner
        run: |
          LIMIT="${{ github.event.inputs.limit || '20' }}"
          python scanner.py --limit "$LIMIT" --output-dir scan_results
      - name: Verify staged output
        run: |
          python - <<'PY'
          import json
          p=json.load(open('scan_results/latest.json'))
          base=p['successful_baseline']
          s1=p['successful_stage1_false_breakout']
          s2=p['successful_stage2_demand_supply']
          assert base > 0, 'baseline returned zero symbols'
          assert s1 == base, f'false-breakout incomplete: {s1}/{base}'
          assert s2 == base, f'demand-supply incomplete: {s2}/{base}'
          assert p.get('speed_modes_enabled') is False, 'speed mode unexpectedly enabled'
          print(f'STAGED VERIFIED: baseline={base}, false_breakout={s1}, demand_supply={s2}')
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: share-scan-staged-results
          path: scan_results/
          if-no-files-found: error
          retention-days: 14
