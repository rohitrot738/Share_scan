name: Share Scan

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of NSE symbols to scan
        required: false
        default: "20"
  issues:
    types: [opened]

concurrency:
  group: share-scan
  cancel-in-progress: true

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[RUN]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate scanner
        run: |
          python -m py_compile scanner.py false_breakout_filter.py demand_supply.py
          python -c "import scanner; print('scanner imports OK')"
      - name: Run NSE scanner
        run: |
          LIMIT="${{ github.event.inputs.limit || '20' }}"
          python scanner.py --limit "$LIMIT" --output-dir scan_results
      - name: Verify result
        run: |
          python - <<'PY'
          import json
          p=json.load(open('scan_results/latest.json'))
          assert p['successful'] == p['requested'], f"incomplete result: {p['successful']}/{p['requested']}"
          print('VERIFIED:', p['successful'])
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: share-scan-results
          path: scan_results/
          if-no-files-found: error
          retention-days: 14
