name: Share Scan

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of symbols to scan; 0 = full configured universe'
        required: false
        default: '0'
  push:
    branches: [main]
    paths:
      - 'scan_trigger.txt'
  schedule:
    # Weekdays: around 10:05 IST and 14:05 IST. UTC cron.
    - cron: '35 4 * * 1-5'
    - cron: '35 8 * * 1-5'

permissions:
  contents: write

concurrency:
  group: share-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Share_scan engine
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          python universe_scan.py --limit "$LIMIT" --output-dir scan_results

      - name: Upload exact scan output
        uses: actions/upload-artifact@v4
        with:
          name: share-scan-results
          path: |
            scan_results/latest.json
            scan_results/latest.csv
          retention-days: 14

      - name: Commit latest result for ChatGPT inspection
        run: |
          git config user.name 'share-scan-bot'
          git config user.email 'share-scan-bot@users.noreply.github.com'
          git add scan_results/latest.json scan_results/latest.csv
          if git diff --cached --quiet; then
            echo 'No result change to commit.'
          else
            git commit -m 'Update automated Share_scan results'
            git push
          fi
